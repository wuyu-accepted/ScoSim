    neutral: 0.25
    curious: 0.35
    supportive: 0.40
    skeptical: 0.58
    concerned: 0.62
    frustrated: 0.78
    urgent: 0.90
  confidence: "abs(public_stance), clipped to [0,1]; null maps to 0"
  trust_delta: 0.0
  satisfaction_delta: 0.0
  evidence_status: "unverified"
anti_imputation:
  - "Do not infer trust or satisfaction change from generated prose."
  - "Do not infer evidence verification from fluent or factual-looking prose."
  - "Do not use blind-judge labels as assimilation input."
native_kernel: "campuspulse_core.governance_arena_v2.assimilate_forum_llm_updates_v2"
outputs:
