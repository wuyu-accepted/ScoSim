schema_version: "campuspulse-action-assimilation-v1.0.0"
status: "frozen"
frozen_at: "2026-09-18T20:05:00+08:00"
purpose: "Bridge the shared method-neutral action record to the existing native CampusPulse ForumTwin particle assimilation kernel."
scope:
